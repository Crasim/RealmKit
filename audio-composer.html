<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealmKit — Audio Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0a0a12;
  --surface:      #1e1208;
  --panel:        #2c1a0c;
  --wood:         #2a1408;
  --wood-lt:      #3a2010;
  --wood-shadow:  #1a0800;
  --border:       #5a3c20;
  --border-lt:    #8a6040;
  --accent:       #c8a840;
  --accent-lt:    #e8c860;
  --danger:       #c84040;
  --warn:         #e89030;
  --text:         #e8d8c8;
  --muted:        #907860;
  --parchment:    #d4c4a0;
  --parchment-dk: #b8a880;
  --success:      #40c870;
  --info:         #4090c8;
}

body {
  font-family: 'Press Start 2P', monospace;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 20% 20%, #1a1a28 0%, transparent 45%),
    radial-gradient(circle at 80% 80%, #1a1a28 0%, transparent 45%);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 10px;
}

/* ── HEADER ── */
header {
  display: flex; align-items: center; gap: 8px;
  padding: 0 12px; height: 54px; flex-shrink: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0px, transparent 5px, rgba(80,50,20,0.25) 5px, rgba(80,50,20,0.25) 6px),
    repeating-linear-gradient(0deg, transparent 0px, transparent 12px, rgba(60,35,15,0.18) 12px, rgba(60,35,15,0.18) 18px),
    linear-gradient(180deg, #4a2810 0%, #2a1408 50%, #1a0c04 100%);
  border-bottom: 5px solid var(--wood-shadow);
  box-shadow: inset 0 3px 0 rgba(255,200,150,0.18), inset 0 -2px 0 rgba(0,0,0,0.4), 0 4px 0 2px rgba(0,0,0,0.35);
  z-index: 10;
}
.brand { display:flex; align-items:center; gap:6px; margin-right:10px; }
.brand-icon { font-size:16px; }
.brand-name { font-size:8px; color:var(--accent); text-shadow:0 0 8px rgba(200,168,64,0.5); letter-spacing:2px; }
.brand-sub  { font-size:6px; color:var(--muted); letter-spacing:3px; }
.hdr-div { width:2px; height:30px; background:linear-gradient(180deg,transparent,var(--border),transparent); flex-shrink:0; }

/* Transport controls */
.transport { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.btn-transport {
  font-family:inherit; font-size:7px; padding:6px 10px;
  border:2px solid; border-bottom-width:3px; cursor:pointer;
  text-transform:uppercase; letter-spacing:1px; transition:all 0.05s;
}
.btn-play  { background:linear-gradient(180deg,#286020,#184010 50%,#102808); color:#90c890; border-color:#3a6030; box-shadow:0 3px 0 #0a1808; }
.btn-stop  { background:linear-gradient(180deg,#4a4a58,#3a3a48 50%,#2a2a38); color:#c8c8d8; border-color:#5a5a68; box-shadow:0 3px 0 #1a1a28; }
.btn-rec   { background:linear-gradient(180deg,#803030,#602020 50%,#401010); color:#ffd0d0; border-color:#a04040; box-shadow:0 3px 0 #200808; }
.btn-rec.active { background:linear-gradient(180deg,#c04040,#a03030 50%,#802020); border-color:#e05050; animation:pulse-red 1s infinite; }
.btn-transport:hover { filter:brightness(1.2); }
.btn-transport:active { transform:translateY(3px); box-shadow:none !important; border-bottom-width:0 !important; }
@keyframes pulse-red { 0%,100%{box-shadow:0 3px 0 #200808} 50%{box-shadow:0 3px 8px #ff404080} }

.bpm-group { display:flex; align-items:center; gap:4px; }
.bpm-lbl   { font-size:6px; color:var(--muted); }
.bpm-input {
  font-family:inherit; font-size:8px; width:52px; text-align:center; padding:4px;
  background:#1a0e06; border:2px solid var(--border); color:var(--accent);
  border-bottom-width:3px; border-bottom-color:var(--wood-shadow);
}
.bpm-arrows { display:flex; flex-direction:column; gap:1px; }
.bpm-arr { font-family:inherit; font-size:6px; padding:1px 4px; background:var(--wood-lt); border:1px solid var(--border); color:var(--text); cursor:pointer; line-height:1; }
.bpm-arr:hover { background:var(--border); }

.bars-group { display:flex; align-items:center; gap:4px; }
.bars-lbl   { font-size:6px; color:var(--muted); }
.bar-btn    { font-family:inherit; font-size:6px; padding:4px 6px; background:var(--wood-lt); border:1px solid var(--border); color:var(--muted); cursor:pointer; }
.bar-btn.active { background:var(--accent); color:#1a0e06; border-color:var(--accent-lt); }
.bar-btn:hover { background:var(--border-lt); color:var(--text); }

.hdr-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.btn-hdr   { font-family:inherit; font-size:6px; padding:5px 8px; background:var(--wood-lt); border:1px solid var(--border); color:var(--text); cursor:pointer; border-bottom-width:2px; border-bottom-color:var(--wood-shadow); }
.btn-hdr:hover { background:var(--border); }
.btn-hdr.accent { border-color:var(--accent); color:var(--accent); }

/* ── MAIN AREA ── */
.main { display:flex; flex:1; min-height:0; overflow:hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width:210px; flex-shrink:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#2a1408,#1a0c04);
  border-right:3px solid var(--wood-shadow);
  overflow:hidden;
}

/* Sidebar tabs */
.sb-tabs {
  display:flex; flex-shrink:0;
  border-bottom:2px solid var(--wood-shadow);
}
.sb-tab {
  font-family:inherit; font-size:5px; padding:6px 8px; flex:1;
  background:var(--wood); border:none; border-right:1px solid var(--wood-shadow);
  color:var(--muted); cursor:pointer; letter-spacing:1px; text-align:center;
  transition:all 0.1s;
}
.sb-tab:last-child { border-right:none; }
.sb-tab.active { background:linear-gradient(180deg,#3a2010,#2a1408); color:var(--accent); }
.sb-tab:hover:not(.active) { background:var(--wood-lt); color:var(--text); }

/* Sidebar panels */
.sb-panel { display:none; flex-direction:column; flex:1; overflow:hidden; }
.sb-panel.active { display:flex; }

.btn-add-track {
  font-family:inherit; font-size:7px; padding:8px; width:100%;
  background:linear-gradient(180deg,#1a3820,#0e2010);
  border:none; border-top:1px solid #3a5030; border-bottom:2px solid #0a1008;
  color:#6eda90; cursor:pointer; letter-spacing:1px;
  flex-shrink:0;
}
.btn-add-track:hover { background:linear-gradient(180deg,#2a4830,#1a3020); }

.track-list { flex:1; overflow-y:auto; }
.track-list::-webkit-scrollbar { width:6px; }
.track-list::-webkit-scrollbar-track { background:var(--wood); }
.track-list::-webkit-scrollbar-thumb { background:var(--border); }

/* Projects panel */
.proj-list { flex:1; overflow-y:auto; padding:4px; display:flex; flex-direction:column; gap:4px; }
.proj-list::-webkit-scrollbar { width:6px; }
.proj-list::-webkit-scrollbar-track { background:var(--wood); }
.proj-list::-webkit-scrollbar-thumb { background:var(--border); }
.proj-empty {
  padding:16px 8px; text-align:center; color:var(--muted);
  font-size:6px; line-height:2.2;
}
.proj-card {
  border:1px solid var(--border); padding:6px 7px;
  background:rgba(42,20,8,0.5); cursor:pointer;
  transition:border-color 0.1s;
}
.proj-card:hover { border-color:var(--border-lt); }
.proj-card.active { border-color:var(--accent); background:rgba(200,168,64,0.08); }
.proj-name {
  font-size:7px; color:var(--text); margin-bottom:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.proj-card.active .proj-name { color:var(--accent-lt); }
.proj-meta { font-size:5px; color:var(--muted); line-height:1.8; }
.proj-btns { display:flex; gap:3px; margin-top:5px; }
.proj-btn {
  font-family:inherit; font-size:5px; padding:3px 5px; cursor:pointer;
  border:1px solid; flex:1; text-align:center;
}
.proj-btn-load   { background:#1a3820; border-color:#3a6030; color:#6eda90; }
.proj-btn-load:hover { background:#2a4830; }
.proj-btn-del    { background:#3a1010; border-color:#803030; color:#f08080; flex:0 0 auto; padding:3px 6px; }
.proj-btn-del:hover  { background:#501818; }
.proj-btn-export { background:#1a1a38; border-color:#404080; color:#8080f0; }
.proj-btn-export:hover { background:#2a2a48; }
.proj-btn-cloud  { background:#1a3028; border-color:#3a6050; color:#6ec8a8; }
.proj-btn-cloud:hover { background:#2a4038; }
/* Projects LOCAL/SERVER sub-toggle */
.proj-subtabs { display:flex; flex-shrink:0; border-bottom:2px solid var(--border); }
.proj-subtab {
  flex:1; padding:4px 6px; font-size:5px; cursor:pointer; font-family:inherit;
  background:var(--panel); color:var(--muted); border:none; border-bottom:2px solid transparent;
  transition:color .15s;
}
.proj-subtab.active { color:var(--accent); border-bottom-color:var(--accent); background:rgba(200,168,64,.07); }
.proj-subtab:hover:not(.active) { color:var(--text); }

.track-item {
  display:flex; flex-direction:column; padding:7px 8px 5px;
  border-bottom:1px solid rgba(90,60,32,0.4);
  cursor:pointer; transition:background 0.1s; position:relative;
}
.track-item:hover   { background:rgba(90,60,32,0.3); }
.track-item.selected { background:rgba(200,168,64,0.12); border-left:3px solid var(--accent); }
.track-item.selected .track-name { color:var(--accent-lt); }
.track-color-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0; }
.track-top { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.track-name-input {
  font-family:inherit; font-size:7px; background:transparent; border:none;
  color:var(--text); width:90px; outline:none; cursor:text;
  padding:0; min-width:0;
}
.track-name-input:focus { background:rgba(0,0,0,0.3); padding:1px 3px; }
.track-inst-lbl { font-size:5px; color:var(--muted); flex-shrink:0; }
.track-bottom { display:flex; align-items:center; gap:4px; }
.btn-mute,.btn-solo,.btn-del {
  font-family:inherit; font-size:5px; padding:2px 4px;
  border:1px solid var(--border); cursor:pointer; flex-shrink:0;
}
.btn-mute { background:var(--wood-lt); color:var(--muted); }
.btn-mute.active { background:#604020; color:#ffcc80; border-color:#a07040; }
.btn-solo { background:var(--wood-lt); color:var(--muted); }
.btn-solo.active { background:#204060; color:#80c0ff; border-color:#4080a0; }
.btn-del { background:var(--wood-lt); color:var(--danger); border-color:#803030; margin-left:auto; }
.btn-del:hover { background:#402020; }
.vol-slider { flex:1; accent-color:var(--accent); height:8px; cursor:pointer; }
.track-item.muted { opacity:0.45; }

/* ── EDITOR ── */
.editor { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar {
  display:flex; align-items:center; gap:8px; padding:5px 10px; flex-shrink:0;
  background:linear-gradient(180deg,#1e1208,#160e04);
  border-bottom:2px solid var(--wood-shadow);
  flex-wrap:wrap;
}
.toolbar-group { display:flex; align-items:center; gap:3px; }
.tool-lbl { font-size:5px; color:var(--muted); margin-right:3px; }
.btn-tool {
  font-family:inherit; font-size:6px; padding:4px 7px;
  background:var(--wood-lt); border:1px solid var(--border); color:var(--muted);
  cursor:pointer;
}
.btn-tool.active { background:var(--accent); color:#1a0e06; border-color:var(--accent-lt); }
.btn-tool:hover:not(.active) { background:var(--border); color:var(--text); }
.toolbar-div { width:1px; height:20px; background:var(--border); margin:0 2px; }

.roll-area { flex:1; position:relative; overflow:hidden; background:#0a0806; }
#main-canvas { display:block; cursor:crosshair; image-rendering:pixelated; }

/* No-track placeholder */
.no-track-msg {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:10px; color:var(--muted); pointer-events:none;
}
.no-track-msg .big  { font-size:24px; }
.no-track-msg .msg  { font-size:7px; line-height:2; text-align:center; }

/* ── BOTTOM: KEYBOARD / DRUM PADS ── */
.bottom-panel {
  flex-shrink:0; background:linear-gradient(180deg,#1a0e06,#100a04);
  border-top:3px solid var(--wood-shadow);
  display:flex; flex-direction:column; overflow:hidden;
}
.bottom-hdr {
  display:flex; align-items:center; gap:8px; padding:4px 10px;
  background:linear-gradient(180deg,#2a1408,#1e1008);
  border-bottom:1px solid var(--wood-shadow); flex-shrink:0;
}
.bottom-hdr span { font-size:6px; color:var(--muted); }
.octave-btn { font-family:inherit; font-size:6px; padding:2px 6px; background:var(--wood-lt); border:1px solid var(--border); color:var(--text); cursor:pointer; }
.octave-btn:hover { background:var(--border); }
.octave-display { font-size:6px; color:var(--accent); }

/* Piano keyboard */
.keyboard-wrap { flex:1; display:flex; align-items:flex-end; overflow:hidden; padding:4px 8px; gap:1px; position:relative; min-height:90px; }
.key {
  position:relative; cursor:pointer; border:1px solid #3a2010; border-bottom-width:3px;
  transition:filter 0.05s; flex-shrink:0;
}
.key.white {
  width:24px; height:80px;
  background:linear-gradient(180deg,#f8f0e8,#e8dcc8);
  border-color:#7a5030; border-bottom-color:#4a2810;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,0.2);
}
.key.black {
  width:15px; height:52px; z-index:2;
  background:linear-gradient(180deg,#2a1808,#1a0c04);
  border-color:#6a4020; border-bottom-color:#0a0400;
  box-shadow:inset 0 -2px 0 rgba(255,150,50,0.1);
  margin-left:-8px; margin-right:-8px;
}
.key.white:hover,.key.white.active { background:linear-gradient(180deg,var(--accent-lt),var(--accent)); }
.key.black:hover,.key.black.active { background:linear-gradient(180deg,#3a2010,#2a1008); border-color:var(--accent); }
.key-label { position:absolute; bottom:3px; left:50%; transform:translateX(-50%); font-size:4px; color:#907060; pointer-events:none; }
.key.black .key-label { display:none; }

/* Drum pads */
.drum-pads { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:8px; flex:1; }
.drum-pad {
  font-family:inherit; font-size:6px; padding:6px 4px;
  border:2px solid; border-bottom-width:3px; cursor:pointer;
  text-align:center; line-height:1.6; transition:all 0.05s;
}
.drum-pad:active,.drum-pad.flash { transform:translateY(3px); border-bottom-width:0 !important; filter:brightness(1.5); }

/* ── INSTRUMENT PICKER MODAL ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100;
  display:none; align-items:center; justify-content:center;
}
.modal-overlay.open { display:flex; }
.modal-box {
  background:var(--panel);
  border:3px solid var(--border); border-bottom-width:5px; border-bottom-color:var(--wood-shadow);
  padding:16px; min-width:280px;
  box-shadow:0 8px 0 var(--wood-shadow), inset 0 2px 0 rgba(255,200,150,0.1);
}
.modal-title { font-size:8px; color:var(--accent); margin-bottom:14px; letter-spacing:2px; }
.modal-row { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
.modal-lbl { font-size:6px; color:var(--muted); margin-bottom:3px; }
.modal-input,.modal-select {
  font-family:inherit; font-size:7px; padding:5px 7px;
  background:#1a0e06; border:2px solid var(--border); color:var(--text);
  border-bottom-width:3px; border-bottom-color:var(--wood-shadow);
}
.modal-select option { background:#2a1408; }
.modal-btns { display:flex; gap:8px; margin-top:12px; }
.btn-modal {
  font-family:inherit; font-size:7px; padding:7px 12px; flex:1; cursor:pointer;
  border:2px solid; border-bottom-width:3px; text-align:center;
}
.btn-ok     { background:linear-gradient(180deg,#286020,#184010); color:#90c890; border-color:#3a6030; box-shadow:0 3px 0 #0a1808; }
.btn-cancel { background:var(--wood-lt); color:var(--muted); border-color:var(--border); box-shadow:0 3px 0 var(--wood-shadow); }
.btn-modal:hover { filter:brightness(1.2); }
.btn-modal:active { transform:translateY(3px); box-shadow:none !important; border-bottom-width:0 !important; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:16px; right:16px; z-index:200;
  background:var(--panel); border:2px solid var(--accent); padding:8px 12px;
  font-size:7px; color:var(--accent); pointer-events:none; opacity:0;
  transition:opacity 0.3s; box-shadow:0 4px 0 var(--wood-shadow);
}
.toast.show { opacity:1; }

/* ── SCROLLBARS ── */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:#1a0e06; }
::-webkit-scrollbar-thumb { background:var(--border); }
::-webkit-scrollbar-thumb:hover { background:var(--border-lt); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <span class="brand-icon">🎵</span>
    <div>
      <div class="brand-name">RealmKit</div>
      <div class="brand-sub">Audio Composer</div>
    </div>
  </div>
  <div class="hdr-div"></div>

  <div class="transport">
    <button class="btn-transport btn-play" id="btn-play" onclick="togglePlay()">▶ Play</button>
    <button class="btn-transport btn-stop" onclick="stopAll()">■ Stop</button>
    <button class="btn-transport btn-rec"  id="btn-rec"  onclick="toggleRecord()">● Rec</button>

    <div class="hdr-div"></div>

    <div class="bpm-group">
      <span class="bpm-lbl">BPM</span>
      <input  class="bpm-input" id="bpm-input" type="number" min="40" max="240" value="120" onchange="setBpm(this.value)">
      <div class="bpm-arrows">
        <button class="bpm-arr" onclick="adjustBpm(1)">▲</button>
        <button class="bpm-arr" onclick="adjustBpm(-1)">▼</button>
      </div>
    </div>

    <div class="hdr-div"></div>

    <div class="bars-group">
      <span class="bars-lbl">BARS</span>
      <button class="bar-btn" data-bars="1" onclick="setBars(1)">1</button>
      <button class="bar-btn active" data-bars="2" onclick="setBars(2)">2</button>
      <button class="bar-btn" data-bars="4" onclick="setBars(4)">4</button>
      <button class="bar-btn" data-bars="8" onclick="setBars(8)">8</button>
    </div>
  </div>

  <div class="hdr-right">
    <button class="btn-hdr" onclick="newProject()">✦ New</button>
    <button class="btn-hdr accent" onclick="saveLocally()">💾 Save</button>
    <button class="btn-hdr" onclick="saveToServer()" title="Save project to server database" style="background:#1a3028;border-color:#3a6050;color:#6ec8a8;">☁️ Cloud</button>
    <button class="btn-hdr" onclick="exportJSON()" title="Download project as JSON file">⬇ Export</button>
    <button class="btn-hdr" onclick="importJSON()" title="Import project from JSON file">⬆ Import</button>
    <input type="file" id="load-input" accept=".json" style="display:none" onchange="onLoadFile(this)">
    <span id="proj-title" style="font-size:6px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- Tab strip -->
    <div class="sb-tabs">
      <button class="sb-tab active" id="sbtab-tracks"   onclick="setSbTab('tracks')">◈ TRACKS</button>
      <button class="sb-tab"        id="sbtab-projects" onclick="setSbTab('projects')">📁 PROJECTS</button>
    </div>

    <!-- Tracks panel -->
    <div class="sb-panel active" id="sbpanel-tracks">
      <button class="btn-add-track" onclick="openAddTrack()">+ Add Track
        <span id="track-count" style="float:right;color:var(--muted)">0</span>
      </button>
      <div class="track-list" id="track-list"></div>
    </div>

    <!-- Projects panel -->
    <div class="sb-panel" id="sbpanel-projects">
      <!-- Local / Server sub-toggle -->
      <div class="proj-subtabs">
        <button class="proj-subtab active" id="projsubtab-local"  onclick="switchProjectsView('local')">💾 Local</button>
        <button class="proj-subtab"        id="projsubtab-server" onclick="switchProjectsView('server')">☁️ Server</button>
      </div>
      <div class="proj-list" id="proj-list"></div>
      <div class="proj-list" id="proj-server-list" style="display:none;"></div>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="editor">
    <div class="toolbar">
      <div class="toolbar-group">
        <span class="tool-lbl">MODE</span>
        <button class="btn-tool active" id="tool-draw"  onclick="setTool('draw')">✎ Draw</button>
        <button class="btn-tool"        id="tool-erase" onclick="setTool('erase')">✕ Erase</button>
      </div>
      <div class="toolbar-div"></div>
      <div class="toolbar-group">
        <span class="tool-lbl">LENGTH</span>
        <button class="btn-tool" data-len="1"  onclick="setNoteLen(1)">1/16</button>
        <button class="btn-tool" data-len="2"  onclick="setNoteLen(2)">1/8</button>
        <button class="btn-tool active" data-len="4" onclick="setNoteLen(4)">1/4</button>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════════════════
const S = {
  bpm: 120,
  bars: 2,
  tool: 'draw',      // 'draw' | 'erase'
  noteLen: 4,        // in 16th-note steps
  zoom: 1.0,
  tracks: [],
  selId: null,
  nextId: 1,
  octave: 4,         // base octave for keyboard
  isPlaying: false,
  isRecording: false,
  scrollX: 0,        // pixels
  scrollY: 0,        // pixels
  currentProjectId: null,   // id of last-saved/loaded local project (enables overwrite on Save)
  currentServerId:  null,   // id of last-saved/loaded server project
};

// ── localStorage project key ──────────────────────────────────────────────
const LS_KEY = 'rk_audio_projects';

const TRACK_COLORS = [
  '#c8a840','#40c870','#4090c8','#c84060','#9040c8',
  '#40c8a0','#c87040','#c0c0d0','#e08030','#60c0e0'
];

// Piano roll constants
const PIANO_W = 64;
const NOTE_H  = 15;
const MIN_STEP_W = 16;
const NOTE_LO = 24;   // C1  MIDI
const NOTE_HI = 84;   // C6  MIDI
const TOTAL_NOTES = NOTE_HI - NOTE_LO;  // 60 rows

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const IS_BLACK   = [false,true,false,true,false,false,true,false,true,false,true,false];

function noteName(midi) { return NOTE_NAMES[midi % 12] + Math.floor(midi / 12 - 1); }
function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }
function stepW() { return Math.max(MIN_STEP_W, Math.round(MIN_STEP_W * 2 * S.zoom)); }
function totalSteps() { return S.bars * 16; }

// ═══════════════════════════════════════════════════════════════════════════════
//  WEB AUDIO ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
let ctx = null, masterGain = null, trackGains = {};

function ensureAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 8;
  comp.attack.value = 0.003;  comp.release.value = 0.1;
  masterGain = ctx.createGain(); masterGain.gain.value = 0.85;
  masterGain.connect(comp); comp.connect(ctx.destination);
}
function trackGain(track) {
  if (!trackGains[track.id]) {
    const g = ctx.createGain(); g.gain.value = track.volume; g.connect(masterGain);
    trackGains[track.id] = g;
  }
  return trackGains[track.id];
}

// ── Instrument synths ──────────────────────────────────────────────────────
function playMelodicNote(track, midi, dur, when, vel) {
  vel = vel || 0.8; dur = dur || S.noteLen;
  const freq = midiToFreq(midi);
  const tg = trackGain(track);
  const sec = stepsToSec(dur);
  const inst = track.instrument;

  if (inst === 'piano') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    // Add slight brightness harmonic
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine'; o2.frequency.value = freq * 2; g2.gain.value = 0.12;
    g.gain.setValueAtTime(vel * 0.9, when);
    g.gain.linearRampToValueAtTime(vel * 0.7, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.min(sec * 1.4, 2.2));
    o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(tg); o.start(when); o2.start(when);
    const off = Math.min(sec * 1.4, 2.2) + 0.02;
    o.stop(when + off); o2.stop(when + off);

  } else if (inst === 'guitar') {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = freq * 5; f.Q.value = 1.5;
    g.gain.setValueAtTime(vel * 0.6, when);
    g.gain.linearRampToValueAtTime(vel * 0.6, when + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.min(sec + 0.3, 1.2));
    o.connect(f); f.connect(g); g.connect(tg); o.start(when); o.stop(when + 1.25);

  } else if (inst === 'bass') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq * 0.5;  // sub octave
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'triangle'; o2.frequency.value = freq; g2.gain.value = 0.25;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vel * 0.9, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.min(sec * 1.2, 1.8));
    o2.connect(g2); g2.connect(g);
    o.connect(g); g.connect(tg); o.start(when); o2.start(when);
    o.stop(when + 1.85); o2.stop(when + 1.85);

  } else if (inst === 'strings') {
    const o = ctx.createOscillator(), filt = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq;
    filt.type = 'lowpass'; filt.frequency.value = freq * 4; filt.Q.value = 0.8;
    const attack = 0.25, hold = Math.max(sec - 0.3, 0.25), release = 0.4;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vel * 0.45, when + attack);
    g.gain.setValueAtTime(vel * 0.45, when + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.001, when + attack + hold + release);
    o.connect(filt); filt.connect(g); g.connect(tg); o.start(when); o.stop(when + attack + hold + release + 0.05);

  } else if (inst === 'lead') {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    o2.type = 'square'; o2.frequency.value = freq * 1.0035;
    const g2 = ctx.createGain(); g2.gain.value = 0.35; o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(vel * 0.55, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.min(sec + 0.08, 1.2));
    o.connect(g); g.connect(tg); o.start(when); o2.start(when);
    o.stop(when + 1.25); o2.stop(when + 1.25);

  } else if (inst === 'pad') {
    const o = ctx.createOscillator(), filt = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    const o5 = ctx.createOscillator(), g5 = ctx.createGain();
    o5.type = 'sine'; o5.frequency.value = freq * 1.5; g5.gain.value = 0.35;
    filt.type = 'lowpass'; filt.frequency.value = 2200;
    const att = 0.35, rel = 0.5;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vel * 0.4, when + att);
    g.gain.setValueAtTime(vel * 0.4, when + Math.max(sec - rel, att));
    g.gain.exponentialRampToValueAtTime(0.001, when + sec + rel);
    o5.connect(g5); g5.connect(filt); o.connect(filt); filt.connect(g); g.connect(tg);
    o.start(when); o5.start(when); o.stop(when + sec + rel + 0.05); o5.stop(when + sec + rel + 0.05);

  } else if (inst === 'organ') {
    [1, 2, 3, 4].forEach((h, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq * h;
      const vols = [0.6, 0.45, 0.25, 0.12];
      g.gain.setValueAtTime(vel * vols[i], when);
      g.gain.exponentialRampToValueAtTime(0.001, when + sec + 0.05);
      o.connect(g); g.connect(tg); o.start(when); o.stop(when + sec + 0.1);
    });

  } else if (inst === 'harp') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine'; o2.frequency.value = freq * 4; g2.gain.value = 0.08;
    g.gain.setValueAtTime(vel * 0.7, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + Math.min(sec * 2, 3.0));
    o2.connect(g2); g2.connect(g); o.connect(g); g.connect(tg);
    o.start(when); o2.start(when); o.stop(when + 3.05); o2.stop(when + 3.05);
  }
}

// ── Drum synthesis ──────────────────────────────────────────────────────────
const DRUM_DEFS = {
  kick:   { icon:'🥁', label:'Kick',    color:'#c84040' },
  snare:  { icon:'🪘', label:'Snare',   color:'#c8a040' },
  hihatC: { icon:'🔔', label:'HH Cls',  color:'#c8c840' },
  hihatO: { icon:'🔕', label:'HH Opn',  color:'#e8e060' },
  tomH:   { icon:'🎵', label:'Tom Hi',  color:'#40c870' },
  tomL:   { icon:'🎶', label:'Tom Lo',  color:'#40a850' },
  clap:   { icon:'👏', label:'Clap',    color:'#c04090' },
  crash:  { icon:'✨', label:'Crash',   color:'#4090c8' },
};
const DRUM_KEYS = Object.keys(DRUM_DEFS);

function noise(dur) {
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const s = ctx.createBufferSource(); s.buffer = buf; return s;
}

function playDrumHit(drumId, vel, when, tg) {
  vel = vel || 0.8; when = when || ctx.currentTime;
  if (!tg && S.selId) { const t = getTrack(S.selId); if (t) tg = trackGain(t); }
  if (!tg) { const g = ctx.createGain(); g.gain.value = 0.85; g.connect(masterGain); tg = g; }

  if (drumId === 'kick') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, when); o.frequency.exponentialRampToValueAtTime(0.001, when + 0.38);
    g.gain.setValueAtTime(vel, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.38);
    o.connect(g); g.connect(tg); o.start(when); o.stop(when + 0.4);
  } else if (drumId === 'snare') {
    const n = noise(0.22), g = ctx.createGain();
    g.gain.setValueAtTime(vel * 0.7, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.22);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.frequency.value = 195; og.gain.setValueAtTime(vel * 0.25, when); og.gain.exponentialRampToValueAtTime(0.001, when + 0.15);
    n.connect(g); g.connect(tg); o.connect(og); og.connect(tg);
    n.start(when); n.stop(when + 0.23); o.start(when); o.stop(when + 0.16);
  } else if (drumId === 'hihatC') {
    const n = noise(0.055), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = 8000;
    g.gain.setValueAtTime(vel * 0.45, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.055);
    n.connect(f); f.connect(g); g.connect(tg); n.start(when); n.stop(when + 0.06);
  } else if (drumId === 'hihatO') {
    const n = noise(0.35), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = 6000;
    g.gain.setValueAtTime(vel * 0.38, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.35);
    n.connect(f); f.connect(g); g.connect(tg); n.start(when); n.stop(when + 0.36);
  } else if (drumId === 'tomH') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(280, when); o.frequency.exponentialRampToValueAtTime(120, when + 0.18);
    g.gain.setValueAtTime(vel * 0.75, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.28);
    o.connect(g); g.connect(tg); o.start(when); o.stop(when + 0.3);
  } else if (drumId === 'tomL') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, when); o.frequency.exponentialRampToValueAtTime(55, when + 0.3);
    g.gain.setValueAtTime(vel * 0.85, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.42);
    o.connect(g); g.connect(tg); o.start(when); o.stop(when + 0.44);
  } else if (drumId === 'clap') {
    [0, 0.012, 0.024].forEach(off => {
      const n = noise(0.055), g = ctx.createGain();
      g.gain.setValueAtTime(vel * 0.55, when + off); g.gain.exponentialRampToValueAtTime(0.001, when + off + 0.055);
      n.connect(g); g.connect(tg); n.start(when + off); n.stop(when + off + 0.06);
    });
  } else if (drumId === 'crash') {
    const n = noise(1.1), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 4000; f.Q.value = 0.5;
    g.gain.setValueAtTime(vel * 0.3, when); g.gain.exponentialRampToValueAtTime(0.001, when + 1.1);
    n.connect(f); f.connect(g); g.connect(tg); n.start(when); n.stop(when + 1.12);
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  PLAYBACK SCHEDULER
// ═══════════════════════════════════════════════════════════════════════════════
let playStartTime = 0, schedStep = 0, schedTimer = null, rafId = null;

function stepsToSec(steps) { return steps * (60 / S.bpm) / 4; }
function getCurrentPlayStep() {
  if (!S.isPlaying || !ctx) return -1;
  const elapsed = ctx.currentTime - playStartTime;
  return Math.floor(elapsed / stepsToSec(1)) % totalSteps();
}

function togglePlay() {
  ensureAudio();
  if (S.isPlaying) { stopAll(); return; }
  S.isPlaying = true;
  playStartTime = ctx.currentTime + 0.06;
  schedStep = 0;
  schedTimer = setInterval(runScheduler, 40);
  rafId = requestAnimationFrame(onRaf);
  document.getElementById('btn-play').textContent = '⏸ Pause';
  document.getElementById('btn-play').style.background = 'linear-gradient(180deg,#607020,#404010 50%,#282808)';
}

function stopAll() {
  S.isPlaying = false; S.isRecording = false;
  clearInterval(schedTimer); schedTimer = null;
  cancelAnimationFrame(rafId);
  document.getElementById('btn-play').textContent = '▶ Play';
  document.getElementById('btn-play').style.background = '';
  document.getElementById('btn-rec').classList.remove('active');
  drawRoll();
}

function toggleRecord() {
  ensureAudio();
  S.isRecording = !S.isRecording;
  document.getElementById('btn-rec').classList.toggle('active', S.isRecording);
  if (S.isRecording && !S.isPlaying) togglePlay();
  toast(S.isRecording ? '● Recording…' : 'Recording off');
}

function runScheduler() {
  if (!S.isPlaying || !ctx) return;
  const lookahead = ctx.currentTime + 0.15;
  const ts = totalSteps();
  const loopDur = stepsToSec(ts);
  // Guard: clamp to max 200 notes scheduled per tick to avoid runaway loops
  let scheduled = 0;
  while (scheduled++ < 200) {
    const stepInLoop = schedStep % ts;
    const loopNum    = Math.floor(schedStep / ts);
    const when = playStartTime + loopNum * loopDur + stepsToSec(stepInLoop);
    if (when > lookahead) break;
    S.tracks.forEach(track => {
      if (track.muted) return;
      // Solo: if any track is soloed, only play soloed tracks
      const anySolo = S.tracks.some(t => t.solo);
      if (anySolo && !track.solo) return;
      const tg = trackGain(track);
      if (track.type === 'drums') {
        track.notes.filter(n => n.step === stepInLoop).forEach(n => playDrumHit(n.drum, n.velocity, when, tg));
      } else {
        track.notes.filter(n => n.step === stepInLoop).forEach(n => playMelodicNote(track, n.pitch, n.duration, when, n.velocity));
      }
    });
    schedStep++;
    // After one full loop, advance playStartTime and reset counter for clean looping
    if (schedStep >= ts) {
      playStartTime += loopDur;
      schedStep = 0;
    }
  }
}

function onRaf() {
  drawRoll();
  rafId = requestAnimationFrame(onRaf);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  TRACK MANAGEMENT
// ═══════════════════════════════════════════════════════════════════════════════
function getTrack(id) { return S.tracks.find(t => t.id === id); }
function selTrack()   { return S.selId ? getTrack(S.selId) : null; }

function addTrack(name, instrument) {
  const type  = instrument === 'drums' ? 'drums' : 'melodic';
  const track = {
    id: S.nextId++, name, type, instrument,
    volume: 0.8, muted: false, solo: false,
    color: TRACK_COLORS[S.tracks.length % TRACK_COLORS.length],
    notes: []
  };
  S.tracks.push(track);
  if (!S.selId) S.selId = track.id;
  renderTrackList();
  updateBottom();
  drawRoll();
  toast('Track added: ' + name);
}

function selectTrack(id) {
  S.selId = id;
  renderTrackList();
  updateBottom();
  drawRoll();
}

function deleteTrack(id) {
  S.tracks = S.tracks.filter(t => t.id !== id);
  if (trackGains[id]) { trackGains[id].disconnect(); delete trackGains[id]; }
  if (S.selId === id) S.selId = S.tracks.length ? S.tracks[0].id : null;
  renderTrackList();
  updateBottom();
  drawRoll();
}

function toggleMute(id) {
  const t = getTrack(id); if (!t) return;
  t.muted = !t.muted;
  renderTrackList();
}
function toggleSolo(id) {
  const t = getTrack(id); if (!t) return;
  t.solo = !t.solo;
  renderTrackList();
}
function setVolume(id, v) {
  const t = getTrack(id); if (!t) return;
  t.volume = v;
  if (trackGains[id]) trackGains[id].gain.value = v;
}

function renderTrackList() {
  const list = document.getElementById('track-list');
  document.getElementById('track-count').textContent = S.tracks.length;
  list.innerHTML = '';
  S.tracks.forEach(track => {
    const div = document.createElement('div');
    div.className = 'track-item' + (track.id === S.selId ? ' selected' : '') + (track.muted ? ' muted' : '');
    div.innerHTML = `
      <div class="track-top">
        <span class="track-color-dot" style="background:${track.color}"></span>
        <input class="track-name-input" value="${track.name}" onchange="getTrack(${track.id}).name=this.value" onclick="selectTrack(${track.id})">
        <span class="track-inst-lbl">${INST_LABELS[track.instrument] || track.instrument}</span>
      </div>
      <div class="track-bottom">
        <button class="btn-mute${track.muted?' active':''}" onclick="event.stopPropagation();toggleMute(${track.id})">M</button>
        <button class="btn-solo${track.solo?' active':''}" onclick="event.stopPropagation();toggleSolo(${track.id})">S</button>
        <input class="vol-slider" type="range" min="0" max="1" step="0.01" value="${track.volume}" oninput="setVolume(${track.id},+this.value)" onclick="event.stopPropagation()">
        <button class="btn-del" onclick="event.stopPropagation();deleteTrack(${track.id})">✕</button>
      </div>`;
    div.addEventListener('click', () => selectTrack(track.id));
    list.appendChild(div);
  });
}

  piano:'🎹 Piano', guitar:'🎸 Guitar', bass:'🔊 Bass', strings:'🎻 Strings',
  lead:'⚡ Lead', pad:'✨ Pad', organ:'🎺 Organ', harp:'🎵 Harp', drums:'🥁 Drums'

// ═══════════════════════════════════════════════════════════════════════════════
//  PIANO ROLL CANVAS
// ═══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('main-canvas');
const cx     = canvas.getContext('2d');
let mouseDown = false, lastNote = null;

function resizeCanvas() {
  const area = document.getElementById('roll-area');
  canvas.width  = area.clientWidth;
  canvas.height = area.clientHeight;
  drawRoll();
}

function drawRoll() {
  const t = selTrack();
  document.getElementById('no-track-msg').style.display = t ? 'none' : 'flex';
  if (!t) return;
  if (t.type === 'drums') drawDrumSeq();
  else drawPianoRoll();
}

const ROLL_HEADER_H = 18;

function drawPianoRoll() {
  const W = canvas.width, H = canvas.height;
  const sw = stepW(), ts = totalSteps();
  cx.clearRect(0, 0, W, H);
  const t = selTrack();

  // ── Background rows ──
  for (let i = 0; i < TOTAL_NOTES; i++) {
    const midi = NOTE_HI - 1 - i;
    const y = ROLL_HEADER_H + i * NOTE_H - S.scrollY;
    if (y + NOTE_H < 0 || y > H) continue;
    const black = IS_BLACK[midi % 12];
    cx.fillStyle = black ? '#c0b092' : '#d8cc9a';
    cx.fillRect(PIANO_W, y, W - PIANO_W, NOTE_H);
    // C note highlight
    if (midi % 12 === 0) {
      cx.fillStyle = '#a89870';
      cx.fillRect(PIANO_W, y + NOTE_H - 1, W - PIANO_W, 1);
    }
  }

  // ── Grid lines (vertical) ──
  for (let s = 0; s <= ts; s++) {
    const x = PIANO_W + s * sw - S.scrollX;
    if (x < PIANO_W || x > W) continue;
    cx.strokeStyle = s % 16 === 0 ? '#7a5838' : s % 4 === 0 ? '#a07850' : '#c8a882';
    cx.lineWidth   = s % 16 === 0 ? 2 : 1;
    cx.beginPath(); cx.moveTo(x, ROLL_HEADER_H); cx.lineTo(x, H); cx.stroke();
  }

  // ── Header (bar/beat ruler) ──
  cx.fillStyle = '#1a0c04';
  cx.fillRect(PIANO_W, 0, W - PIANO_W, ROLL_HEADER_H);
  cx.fillStyle = '#2a1408';
  cx.fillRect(0, 0, PIANO_W, ROLL_HEADER_H);
  cx.fillStyle = '#4a3020';
  cx.fillRect(0, ROLL_HEADER_H - 1, W, 1);
  for (let s = 0; s < ts; s++) {
    const x = PIANO_W + s * sw - S.scrollX;
    if (x + sw < PIANO_W || x > W) continue;
    const beat = Math.floor(s / 4) + 1;
    const sub  = s % 4;
    if (sub === 0) {
      cx.fillStyle = s % 16 === 0 ? '#c8a040' : '#7a5830';
      cx.font = s % 16 === 0 ? '6px "Press Start 2P"' : '5px "Press Start 2P"';
      cx.textBaseline = 'middle';
      const bar = Math.floor(s / 16) + 1;
      cx.fillText(s % 16 === 0 ? 'BAR ' + bar : beat, x + 2, ROLL_HEADER_H / 2);
    }
  }

  // ── Notes ──
  if (t) {
    t.notes.forEach(n => {
      const nx = PIANO_W + n.step * sw - S.scrollX;
      const ni = NOTE_HI - 1 - n.pitch;
      const ny = ROLL_HEADER_H + ni * NOTE_H - S.scrollY;
      const nw = (n.duration || S.noteLen) * sw - 1;
      if (nx + nw < PIANO_W || nx > W || ny + NOTE_H < ROLL_HEADER_H || ny > H) return;
      cx.fillStyle = t.color;
      cx.fillRect(nx, ny + 1, nw, NOTE_H - 2);
      cx.fillStyle = 'rgba(255,255,255,0.25)';
      cx.fillRect(nx, ny + 1, nw, 3);
      cx.strokeStyle = 'rgba(0,0,0,0.35)';
      cx.lineWidth = 1;
      cx.strokeRect(nx + 0.5, ny + 1.5, nw - 1, NOTE_H - 3);
    });
  }

  // ── Playhead ──
  if (S.isPlaying && ctx) {
    const ps = getCurrentPlayStep();
    const px = PIANO_W + ps * sw - S.scrollX;
    if (px >= PIANO_W && px <= W) {
      cx.strokeStyle = '#ff4848'; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(px, ROLL_HEADER_H); cx.lineTo(px, H); cx.stroke();
      // Tick in header
      cx.fillStyle = '#ff4848';
      cx.fillRect(px - 4, ROLL_HEADER_H - 6, 8, 6);
    }
  }

  // ── Piano key column ──
  drawPianoKeys();
}

function drawPianoKeys() {
  const H = canvas.height;
  cx.fillStyle = '#2a1408';
  cx.fillRect(0, ROLL_HEADER_H, PIANO_W, H - ROLL_HEADER_H);
  for (let i = 0; i < TOTAL_NOTES; i++) {
    const midi = NOTE_HI - 1 - i;
    const y = ROLL_HEADER_H + i * NOTE_H - S.scrollY;
    if (y + NOTE_H < ROLL_HEADER_H || y > H) continue;
    const black = IS_BLACK[midi % 12];
    cx.fillStyle = black ? '#2a1808' : '#f0e8d8';
    cx.fillRect(2, y + 1, PIANO_W - 6, NOTE_H - 2);
    if (!black && midi % 12 === 0) {
      cx.fillStyle = '#5a3c20';
      cx.font = '5px "Press Start 2P"';
      cx.textBaseline = 'middle';
      cx.fillText(noteName(midi), 4, y + NOTE_H / 2);
    }
    cx.strokeStyle = '#4a3020';
    cx.lineWidth = 0.5;
    cx.strokeRect(2, y + 1, PIANO_W - 6, NOTE_H - 2);
  }
  cx.fillStyle = '#3a2010';
  cx.fillRect(PIANO_W - 3, ROLL_HEADER_H, 3, H - ROLL_HEADER_H);
}

// ── Drum sequencer ──────────────────────────────────────────────────────────
const DRUM_ROW_H = 32;

const DRUM_HEADER_H = 18;

function drawDrumSeq() {
  const W = canvas.width, H = canvas.height;
  const sw = Math.max(22, Math.round(22 * S.zoom * 1.2));
  const lw = 110;  // label column
  const ts = totalSteps();
  cx.clearRect(0, 0, W, H);

  // ── Beat number header ──────────────────────────────────────────────────
  cx.fillStyle = '#1a0c04';
  cx.fillRect(0, 0, W, DRUM_HEADER_H);
  cx.fillStyle = '#4a3020';
  cx.fillRect(0, DRUM_HEADER_H - 1, W, 1);
  // Label column header
  cx.fillStyle = '#2a1808';
  cx.fillRect(0, 0, lw, DRUM_HEADER_H);
  cx.fillStyle = '#7a5030';
  cx.font = '5px "Press Start 2P"';
  cx.textBaseline = 'middle';
  cx.fillText('DRUMS', 8, DRUM_HEADER_H / 2);
  // Beat numbers
  for (let s = 0; s < ts; s++) {
    const x = lw + s * sw - S.scrollX;
    if (x + sw < lw || x > W) continue;
    const beat = Math.floor(s / 4) + 1;
    const sub  = s % 4;
    cx.fillStyle = sub === 0 ? '#c8a040' : '#5a3c20';
    cx.font = sub === 0 ? '6px "Press Start 2P"' : '5px "Press Start 2P"';
    cx.textBaseline = 'middle';
    cx.fillText(sub === 0 ? beat : '·', x + sw / 2 - (sub === 0 ? 3 : 1), DRUM_HEADER_H / 2);
  }

  DRUM_KEYS.forEach((dk, row) => {
    const def = DRUM_DEFS[dk];
    const y = DRUM_HEADER_H + row * DRUM_ROW_H - S.scrollY;
    if (y + DRUM_ROW_H < 0 || y > H) return;

    // Row label
    cx.fillStyle = row % 2 === 0 ? '#2a1a0c' : '#231608';
    cx.fillRect(0, y, lw, DRUM_ROW_H);
    cx.fillStyle = def.color;
    cx.font = '7px "Press Start 2P"';
    cx.textBaseline = 'middle';
    cx.fillText(def.icon + ' ' + def.label, 6, y + DRUM_ROW_H / 2);

    // Separator
    cx.fillStyle = '#3a2010';
    cx.fillRect(0, y + DRUM_ROW_H - 1, W, 1);

    // Steps
    for (let s = 0; s < ts; s++) {
      const x = lw + s * sw - S.scrollX;
      if (x + sw < lw || x > W) continue;
      const active = getTrack(S.selId)?.notes.some(n => n.drum === dk && n.step === s);
      const isBeat = s % 4 === 0;
      cx.fillStyle = isBeat ? (active ? def.color : '#3a2a14') : (active ? def.color + 'cc' : '#2e1e0e');
      cx.fillRect(x + 1, y + 4, sw - 2, DRUM_ROW_H - 8);
      if (active) {
        // Shine on active pads
        cx.fillStyle = 'rgba(255,255,255,0.2)';
        cx.fillRect(x + 1, y + 4, sw - 2, 4);
      }
      cx.strokeStyle = isBeat ? '#5a4020' : '#3a2810';
      cx.lineWidth = 0.5;
      cx.strokeRect(x + 1, y + 4, sw - 2, DRUM_ROW_H - 8);
    }
  });

  // Beat numbers header overlay

  // Playhead
  if (S.isPlaying && ctx) {
    const ps  = getCurrentPlayStep();
    const sw2 = Math.max(22, Math.round(22 * S.zoom * 1.2));
    const px  = lw + ps * sw2 - S.scrollX;
    cx.strokeStyle = '#ff4848'; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(px, DRUM_HEADER_H); cx.lineTo(px, H); cx.stroke();
    // Playhead tick in header
    cx.fillStyle = '#ff4848';
    cx.fillRect(px - 4, DRUM_HEADER_H - 6, 8, 6);
  }
}

// ── Mouse input ─────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  handleCanvasClick(e);
});
canvas.addEventListener('mousemove', e => {
  if (mouseDown) handleCanvasClick(e);
  updateCursorPos(e);
});
canvas.addEventListener('mouseup', () => { mouseDown = false; lastNote = null; });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); deleteNoteAtEvent(e); });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  S.scrollX = Math.max(0, S.scrollX + e.deltaX * 0.8);
  S.scrollY = Math.max(0, Math.min(S.scrollY + e.deltaY * 0.8, TOTAL_NOTES * NOTE_H - canvas.height / 2));
  drawRoll();
}, { passive: false });

function noteFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const t = selTrack(); if (!t) return null;
  if (t.type === 'melodic') {
    if (y < ROLL_HEADER_H) return null;  // clicked header ruler
    if (x < PIANO_W) {
      // Clicked piano key column — just preview note, don't place
      const row = Math.floor((y - ROLL_HEADER_H + S.scrollY) / NOTE_H);
      const midi = NOTE_HI - 1 - row;
      if (midi >= NOTE_LO && midi < NOTE_HI) { ensureAudio(); playMelodicNote(t, midi, S.noteLen, ctx.currentTime, 0.8); }
      return null;
    }
    const sw = stepW();
    const step = Math.floor((x - PIANO_W + S.scrollX) / sw);
    const row  = Math.floor((y - ROLL_HEADER_H + S.scrollY) / NOTE_H);
    const midi = NOTE_HI - 1 - row;
    if (step < 0 || step >= totalSteps() || midi < NOTE_LO || midi >= NOTE_HI) return null;
    return { step, pitch: midi };
  } else {
    const sw = Math.max(22, Math.round(22 * S.zoom * 1.2));
    const lw = 110;
    if (x < lw || y < DRUM_HEADER_H) return null;
    const step = Math.floor((x - lw + S.scrollX) / sw);
    const row  = Math.floor((y - DRUM_HEADER_H + S.scrollY) / DRUM_ROW_H);
    if (step < 0 || step >= totalSteps() || row < 0 || row >= DRUM_KEYS.length) return null;
    return { step, drum: DRUM_KEYS[row] };
  }
}

function handleCanvasClick(e) {
  const t = selTrack(); if (!t) return;
  const info = noteFromEvent(e); if (!info) return;
  ensureAudio();

  const key = t.type === 'drums' ? (info.step + '_' + info.drum) : (info.step + '_' + info.pitch);
  if (key === lastNote) return;
  lastNote = key;

  if (S.tool === 'erase') {
    deleteNote(t, info);
  } else {
    const exists = t.type === 'drums'
      ? t.notes.some(n => n.step === info.step && n.drum === info.drum)
      : t.notes.some(n => n.step === info.step && n.pitch === info.pitch);
    if (!exists) {
      if (t.type === 'drums') {
        t.notes.push({ step: info.step, drum: info.drum, velocity: 0.8 });
        playDrumHit(info.drum, 0.8, ctx.currentTime, trackGain(t));
      } else {
        t.notes.push({ step: info.step, pitch: info.pitch, duration: S.noteLen, velocity: 0.8 });
        playMelodicNote(t, info.pitch, S.noteLen, ctx.currentTime, 0.8);
      }
    }
  }
  drawRoll();
}

function deleteNoteAtEvent(e) {
  const t = selTrack(); if (!t) return;
  const info = noteFromEvent(e); if (!info) return;
  deleteNote(t, info); drawRoll();
}

function deleteNote(t, info) {
  if (t.type === 'drums') {
    t.notes = t.notes.filter(n => !(n.step === info.step && n.drum === info.drum));
  } else {
    t.notes = t.notes.filter(n => !(n.step === info.step && n.pitch === info.pitch));
  }
}

function updateCursorPos(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const t = selTrack();
  let txt = 'Step —  Note —';
  if (t && t.type === 'melodic' && x > PIANO_W && y > ROLL_HEADER_H) {
    const sw = stepW();
    const step = Math.floor((x - PIANO_W + S.scrollX) / sw) + 1;
    const row  = Math.floor((y - ROLL_HEADER_H + S.scrollY) / NOTE_H);
    const midi = NOTE_HI - 1 - row;
    if (step > 0 && step <= totalSteps() && midi >= NOTE_LO && midi < NOTE_HI)
      txt = 'Step ' + step + '  ' + noteName(midi);
  }
  document.getElementById('cursor-pos').textContent = txt;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  VIRTUAL KEYBOARD
// ═══════════════════════════════════════════════════════════════════════════════
const WHITE_PATTERN = [0,2,4,5,7,9,11]; // C D E F G A B (semitones)
const BLACK_PATTERN = [1,3,-1,6,8,10,-1];

function buildKeyboard() {
  const wrap = document.getElementById('keyboard-wrap');
  wrap.innerHTML = '';
  const loOct = S.octave - 1, hiOct = S.octave + 2;
  for (let oct = loOct; oct <= hiOct; oct++) {
    WHITE_PATTERN.forEach((semi, wi) => {
      const midi = oct * 12 + 12 + semi;
      if (midi < NOTE_LO || midi > NOTE_HI + 12) return;
      const wk = document.createElement('div');
      wk.className = 'key white';
      wk.dataset.midi = midi;
      if (semi === 0) { const lbl = document.createElement('span'); lbl.className='key-label'; lbl.textContent='C'+(oct); wk.appendChild(lbl); }
      // Black key before this white key?
      if (wi < BLACK_PATTERN.length && BLACK_PATTERN[wi] !== -1) {
        const bmidi = oct * 12 + 12 + BLACK_PATTERN[wi];
        if (bmidi >= NOTE_LO && bmidi <= NOTE_HI + 12) {
          const bk = document.createElement('div');
          bk.className = 'key black'; bk.dataset.midi = bmidi;
          wk.appendChild(bk);
          bk.addEventListener('mousedown', kbDown);
          bk.addEventListener('mouseup', kbUp);
          bk.addEventListener('mouseleave', kbUp);
        }
      }
      wk.addEventListener('mousedown', kbDown);
      wk.addEventListener('mouseup', kbUp);
      wk.addEventListener('mouseleave', kbUp);
      wrap.appendChild(wk);
    });
  }
}

function kbDown(e) {
  e.preventDefault(); e.stopPropagation();
  ensureAudio();
  const midi = parseInt(this.dataset.midi);
  this.classList.add('active');
  const t = selTrack();
  if (t && t.type === 'melodic') {
    playMelodicNote(t, midi, S.noteLen, ctx.currentTime, 0.8);
    if (S.isRecording && S.isPlaying) {
      t.notes.push({ step: getCurrentPlayStep(), pitch: midi, duration: S.noteLen, velocity: 0.8 });
      drawRoll();
    }
  }
}
function kbUp() { this.classList.remove('active'); }

// ── QWERTY mapping ──────────────────────────────────────────────────────────
const QWERTY_MAP = {
  'z':0,'s':1,'x':2,'d':3,'c':4,'v':5,'g':6,'b':7,'h':8,'n':9,'j':10,'m':11,
  'q':12,'2':13,'w':14,'3':15,'e':16,'r':17,'5':18,'t':19,'6':20,'y':21,'7':22,'u':23
};
const pressedKeys = new Set();

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  // Shortcuts
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'Escape') { stopAll(); return; }

  if (e.repeat || pressedKeys.has(e.key)) return;
  const semi = QWERTY_MAP[e.key.toLowerCase()];
  if (semi === undefined) return;
  pressedKeys.add(e.key);
  ensureAudio();
  const midi = S.octave * 12 + 12 + semi;
  if (midi < NOTE_LO || midi > NOTE_HI + 12) return;
  // Highlight key
  document.querySelectorAll(`[data-midi="${midi}"]`).forEach(k => k.classList.add('active'));
  const t = selTrack();
  if (t && t.type === 'melodic') {
    playMelodicNote(t, midi, S.noteLen, ctx.currentTime, 0.8);
    if (S.isRecording && S.isPlaying) {
      t.notes.push({ step: getCurrentPlayStep(), pitch: midi, duration: S.noteLen, velocity: 0.8 });
      drawRoll();
    }
  }
});
document.addEventListener('keyup', e => {
  pressedKeys.delete(e.key);
  const semi = QWERTY_MAP[e.key.toLowerCase()];
  if (semi === undefined) return;
  const midi = S.octave * 12 + 12 + semi;
  document.querySelectorAll(`[data-midi="${midi}"]`).forEach(k => k.classList.remove('active'));
});

// ── Drum pads ───────────────────────────────────────────────────────────────
function buildDrumPads() {
  const padArea = document.getElementById('drum-pads');
  padArea.innerHTML = '';
  const colors = ['#c84040','#c8a040','#c8c840','#e8e060','#40c870','#40a850','#c04090','#4090c8'];
  DRUM_KEYS.forEach((dk, i) => {
    const def = DRUM_DEFS[dk];
    const btn = document.createElement('button');
    btn.className = 'drum-pad';
    btn.style.background = `linear-gradient(180deg,${def.color}44,${def.color}22)`;
    btn.style.borderColor = def.color;
    btn.style.color = def.color;
    btn.style.boxShadow = `0 3px 0 ${def.color}80`;
    btn.innerHTML = def.icon + '<br>' + def.label;
    btn.addEventListener('mousedown', () => {
      ensureAudio();
      const t = selTrack();
      playDrumHit(dk, 0.85, ctx.currentTime, t ? trackGain(t) : null);
      btn.classList.add('flash');
      if (S.isRecording && S.isPlaying && t) {
        t.notes.push({ step: getCurrentPlayStep(), drum: dk, velocity: 0.85 });
        drawRoll();
      }
      setTimeout(() => btn.classList.remove('flash'), 100);
    });
    padArea.appendChild(btn);
  });
}

function updateBottom() {
  const t = selTrack();
  const kw = document.getElementById('keyboard-wrap');
  const dp = document.getElementById('drum-pads');
  const bt = document.getElementById('bottom-title');
  const ob = document.querySelector('.bottom-hdr'); // contains octave controls
  if (!t || t.type === 'melodic') {
    kw.style.display = 'flex'; dp.style.display = 'none';
    bt.textContent = 'KEYBOARD';
    if (!kw.children.length) buildKeyboard();
  } else {
    kw.style.display = 'none'; dp.style.display = 'grid';
    bt.textContent = 'DRUM PADS';
    if (!dp.children.length) buildDrumPads();
  }
}

function shiftOctave(dir) {
  S.octave = Math.max(1, Math.min(6, S.octave + dir));
  document.getElementById('oct-display').textContent = 'C' + S.octave;
  buildKeyboard();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  PROJECTS PANEL
// ═══════════════════════════════════════════════════════════════════════════════
function renderProjectsPanel() {
  const list = document.getElementById('proj-list');
  let all = [];
  try { all = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) {}
  if (!all.length) {
    list.innerHTML = '<div class="proj-empty">No saved projects yet.<br><br>Use 💾 Save to store your work<br>and reload it here any time.</div>';
    return;
  }
  list.innerHTML = all.map(p => {
    const date     = p.saved_at ? new Date(p.saved_at).toLocaleDateString() : '';
    const isActive = p.id === S.currentProjectId;
    const trackSummary = (p.track_names || []).slice(0, 3).join(', ') + (p.track_count > 3 ? '…' : '');
    return `<div class="proj-card${isActive ? ' active' : ''}">
      <div class="proj-name">${escHtml(p.name)}${isActive ? ' ✏' : ''}</div>
      <div class="proj-meta">
        ${p.bpm} BPM · ${p.bars} bar${p.bars !== 1 ? 's' : ''} · ${p.track_count} track${p.track_count !== 1 ? 's' : ''}<br>
        ${escHtml(trackSummary)}<br>
        ${date}
      </div>
      <div class="proj-btns">
        <button class="proj-btn proj-btn-load"   onclick="loadLocalProject('${p.id}')">📂 Load</button>
        <button class="proj-btn proj-btn-export" onclick="exportProjectById('${p.id}')" title="Download as JSON">⬇</button>
        <button class="proj-btn proj-btn-del"    onclick="deleteLocalProject('${p.id}')" title="Delete">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function deleteLocalProject(id) {
  if (!confirm('Delete this project? This cannot be undone.')) return;
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    localStorage.setItem(LS_KEY, JSON.stringify(all.filter(p => p.id !== id)));
    if (S.currentProjectId === id) { S.currentProjectId = null; updateProjTitle(); }
  } catch(e) {}
  renderProjectsPanel();
}

// ── Local / Server sub-tab toggle ─────────────────────────────────────────────
let _projectsView = 'local';

function switchProjectsView(view) {
  _projectsView = view;
  document.getElementById('projsubtab-local').classList.toggle('active',  view === 'local');
  document.getElementById('projsubtab-server').classList.toggle('active', view === 'server');
  document.getElementById('proj-list').style.display        = view === 'local'  ? '' : 'none';
  document.getElementById('proj-server-list').style.display = view === 'server' ? '' : 'none';
  if (view === 'server') renderServerProjectsPanel();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SERVER PROJECT SAVE / LOAD
// ═══════════════════════════════════════════════════════════════════════════════

/** POST or PATCH the current project to /api/audio-projects. */
async function saveToServer(overwriteId) {
  const existingId = overwriteId || S.currentServerId || null;
  let name;
  if (existingId) {
    const cached = (_serverProjectsCache || []).find(p => p.id === existingId);
    name = cached ? cached.name : null;
  }
  if (!name) {
    name = prompt('Name this project on the server:\n(e.g. "Tavern Theme" or "Boss Battle v2")');
    if (!name || !name.trim()) return;
    name = name.trim();
  }

  const data = { bpm: S.bpm, bars: S.bars, tracks: S.tracks.map(t => ({ ...t })) };
  const projId = existingId || ('ac_' + Date.now());

  toast('Saving to server…');
  try {
    const res = await fetch('api/audio-projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: projId, name, data }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || res.statusText);
    }
    const saved = await res.json();
    S.currentServerId = saved.id;
    _serverProjectsCache = null;  // invalidate cache
    const verb = existingId ? 'Updated' : 'Saved';
    toast('☁️ ' + verb + ' "' + name + '" on server ✓');
    if (_projectsView === 'server') renderServerProjectsPanel();
  } catch(e) {
    toast('Server save failed — ' + e.message);
  }
}

// In-memory cache for the server panel
let _serverProjectsCache = null;

async function renderServerProjectsPanel() {
  const list = document.getElementById('proj-server-list');
  list.innerHTML = '<div class="proj-empty">Loading…</div>';
  try {
    if (!_serverProjectsCache) {
      const res = await fetch('api/audio-projects');
      if (!res.ok) throw new Error('Server returned ' + res.status);
      _serverProjectsCache = await res.json();
    }
    const all = _serverProjectsCache;
    if (!all.length) {
      list.innerHTML = '<div class="proj-empty">No server projects yet.<br><br>Use ☁️ Cloud to save a project to the server.</div>';
      return;
    }
    list.innerHTML = all.map(p => {
      const date        = p.updated_at ? new Date(p.updated_at).toLocaleDateString() : '';
      const isActive    = p.id === S.currentServerId;
      const trackNames  = (p.track_names || []).slice(0, 3).join(', ') + (p.track_count > 3 ? '…' : '');
      return `<div class="proj-card${isActive ? ' active' : ''}">
        <div class="proj-name">☁️ ${escHtml(p.name)}${isActive ? ' ✏' : ''}</div>
        <div class="proj-meta">
          ${p.bpm} BPM · ${p.bars} bar${p.bars !== 1 ? 's' : ''} · ${p.track_count} track${p.track_count !== 1 ? 's' : ''}<br>
          ${escHtml(trackNames)}<br>
          ${date}
        </div>
        <div class="proj-btns">
          <button class="proj-btn proj-btn-load"  onclick="loadServerProject('${p.id}')">📂 Load</button>
          <button class="proj-btn proj-btn-cloud" onclick="saveToServer('${p.id}')" title="Re-save current work as this project">☁️ Re-save</button>
          <button class="proj-btn proj-btn-del"   onclick="deleteServerProject('${p.id}')" title="Delete from server">🗑</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div class="proj-empty">⚠ Could not reach server.<br><small>' + escHtml(e.message) + '</small><br><br>Is the API running?</div>';
  }
}

async function loadServerProject(id) {
  let project = (_serverProjectsCache || []).find(p => p.id === id);
  // The list endpoint doesn't include project_data — need to fetch the full record
  try {
    const res = await fetch('api/audio-projects/' + id);
    if (!res.ok) throw new Error('Server returned ' + res.status);
    project = await res.json();
  } catch(e) {
    toast('Load failed: ' + e.message);
    return;
  }
  if (!project || !project.data) { toast('Project data missing'); return; }
  if (S.tracks.length > 0 && !confirm('Load "' + project.name + '"? Current work will be cleared.')) return;
  _applyProjectData(project.data);
  S.currentServerId  = project.id;
  S.currentProjectId = null;  // server load ≠ local save
  updateProjTitle();
  setSbTab('tracks');
  toast('☁️ Loaded "' + project.name + '" from server');
}

async function deleteServerProject(id) {
  if (!confirm('Delete this project from the server? This cannot be undone.')) return;
  try {
    const res = await fetch('api/audio-projects/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    _serverProjectsCache = null;
    if (S.currentServerId === id) S.currentServerId = null;
    toast('Server project deleted');
    renderServerProjectsPanel();
  } catch(e) {
    toast('Delete failed — ' + e.message);
  }
}

function exportProjectById(id) {
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    const p = all.find(p => p.id === id);
    if (!p) return;
    const blob = new Blob([JSON.stringify(p.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.name || 'realm-audio').replace(/[^a-zA-Z0-9_-]/g, '-') + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('Exported: ' + p.name);
  } catch(e) { toast('Export failed'); }
}

function updateProjTitle() {
  const el = document.getElementById('proj-title');
  if (!el) return;
  if (!S.currentProjectId) { el.textContent = ''; return; }
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    const p = all.find(p => p.id === S.currentProjectId);
    el.textContent = p ? ('✏ ' + p.name) : '';
  } catch(e) { el.textContent = ''; }
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SAVE / LOAD
// ═══════════════════════════════════════════════════════════════════════════════
function saveLocally(forceNew) {
  // If we already have a project loaded/saved, offer to overwrite it
  const overwriteId = (!forceNew && S.currentProjectId) ? S.currentProjectId : null;
  let name;
  if (overwriteId) {
    try {
      const all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
      const existing = all.find(p => p.id === overwriteId);
      name = existing ? existing.name : null;
    } catch(e) {}
  }
  if (!name) {
    name = prompt('Name this project:\n(e.g. "Tavern Theme" or "Boss Battle v2")');
    if (!name || !name.trim()) return;
    name = name.trim();
  }

  const data = { bpm: S.bpm, bars: S.bars, tracks: S.tracks.map(t => ({ ...t })) };
  const projId = overwriteId || ('ac_' + Date.now());
  const entry = {
    id:          projId,
    name,
    bpm:         S.bpm,
    bars:        S.bars,
    track_count: S.tracks.length,
    track_names: S.tracks.map(t => t.name),
    saved_at:    new Date().toISOString(),
    data,
  };

  try {
    let all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    if (overwriteId) {
      const idx = all.findIndex(p => p.id === overwriteId);
      if (idx !== -1) all[idx] = entry;
      else            all.unshift(entry);
    } else {
      all.unshift(entry);
    }
    localStorage.setItem(LS_KEY, JSON.stringify(all));
    S.currentProjectId = projId;
    updateProjTitle();
    renderProjectsPanel();
    const verb = overwriteId ? 'Updated' : 'Saved';
    toast(verb + ' ✓  "' + name + '"');
  } catch(e) {
    toast('Save failed — localStorage full?');
    alert('Save failed (' + e.message + ')\nTry exporting as JSON instead.');
  }
}

function loadLocalProject(id) {
  try {
    const all = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    const p = all.find(p => p.id === id);
    if (!p || !p.data) { toast('Project not found'); return; }
    if (S.tracks.length > 0 && !confirm('Load "' + p.name + '"? Current work will be cleared.')) return;
    _applyProjectData(p.data);
    S.currentProjectId = id;
    updateProjTitle();
    setSbTab('tracks');
    toast('Loaded: ' + p.name);
  } catch(e) { toast('Load failed: ' + e.message); }
}

function _applyProjectData(data) {
  stopAll();
  S.bpm = data.bpm || 120;
  S.bars = data.bars || 2;
  S.tracks = data.tracks || [];
  S.selId = S.tracks[0]?.id || null;
  S.nextId = S.tracks.reduce((m, t) => Math.max(m, t.id + 1), 1);
  S.scrollX = 0; S.scrollY = 0;
  trackGains = {};
  document.getElementById('bpm-input').value = S.bpm;
  setBars(S.bars);
  renderTrackList(); updateBottom(); drawRoll();
  // Re-center vertically on C4
  setTimeout(() => {
    const h = document.getElementById('roll-area').clientHeight;
    S.scrollY = Math.max(0, (NOTE_HI - 1 - 60) * NOTE_H - h / 2 + NOTE_H * 2);
    drawRoll();
  }, 40);
}

function exportJSON() {
  const name = S.currentProjectId ? (() => {
    try { const all = JSON.parse(localStorage.getItem(LS_KEY)||'[]'); const p=all.find(p=>p.id===S.currentProjectId); return p ? p.name : null; } catch(e){ return null; }
  })() : null;
  const data = { bpm: S.bpm, bars: S.bars, tracks: S.tracks.map(t => ({ ...t })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (name || 'realm-audio').replace(/[^a-zA-Z0-9_-]/g, '-') + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Exported as JSON');
}
function importJSON() { document.getElementById('load-input').click(); }
function onLoadFile(inp) {
  if (!inp.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (S.tracks.length > 0 && !confirm('Import this file? Current work will be cleared.')) return;
      _applyProjectData(data);
      S.currentProjectId = null;  // imported file has no stored ID yet
      updateProjTitle();
      toast('Imported! Hit 💾 Save to keep it.');
    } catch(err) { toast('Error: invalid JSON'); }
  };
  reader.readAsText(inp.files[0]);
  inp.value = '';
}
function newProject() {
  if (S.tracks.length > 0 && !confirm('Start a new project? Unsaved changes will be lost.')) return;
  stopAll();
  S.tracks = []; S.selId = null; S.nextId = 1;
  S.currentProjectId = null; trackGains = {}; S.scrollX = 0; S.scrollY = 0;
  updateProjTitle();
  renderTrackList(); updateBottom(); drawRoll();
  toast('New project');
}

// ═══════════════════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════════════════
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════════════
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
buildKeyboard();

// Seed with a starter track so it doesn't feel empty
addTrack('Piano Lead', 'piano');

// Center piano roll vertically on C4 (midi 60)
setTimeout(() => {
  const h = document.getElementById('roll-area').clientHeight;
  S.scrollY = Math.max(0, (NOTE_HI - 1 - 60) * NOTE_H - h / 2 + NOTE_H * 2);
  drawRoll();
}, 50);

// Restore last project name display if a project was previously active
// (no auto-load — user explicitly chooses from Projects panel)
updateProjTitle();
</script>
