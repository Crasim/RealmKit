    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
        }
        
        body {
            font-family: 'Courier New', monospace;
            color: #eee;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #16213e;
        }
        
        /* UI/HUD Layer - rendered on top of everything */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #info-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 11px;
            color: #888;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 6px;
            text-align: center;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
        }

        body.is-studio-embed #info-bar,
        body.is-studio-embed #rgui-root,
        body.is-studio-embed #rs-root {
            display: none !important;
        }
    </style>

    <!-- Bootstrap -->
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            console.log('[RealmKit] DOM Content Loaded');
            console.log('[RealmKit] Starting engine initialization');
            
            try {
                var engine = new RealmKit.Engine();
                
                var urlParams = new URLSearchParams(window.location.search);
                var mode = urlParams.get('mode');
                var tool = urlParams.get('tool');
                var builderTab = urlParams.get('builderTab');
                var studioMode = urlParams.get('studio') === '1';
                var currentTool = tool || 'map-painter';

                if (studioMode) {
                    document.body.classList.add('is-studio-embed');
                }

                function applyStudioEmbedChrome() {
                    if (!studioMode) return;
                    var info = document.getElementById('info-bar');
                    if (info) info.style.display = 'none';
                    var gameUi = document.getElementById('rgui-root');
                    if (gameUi) gameUi.style.display = 'none';
                    var sidebar = document.getElementById('rs-root');
                    if (sidebar) sidebar.style.display = 'none';
                }

                function launchTool(requestedTool, options) {
                    options = options || {};
                    currentTool = requestedTool || currentTool;
                    try {
                        if (requestedTool === 'map-painter' && engine.mapEditor) {
                            if (engine.worldEditor && engine.worldEditor.visible && engine.worldEditor.hide) engine.worldEditor.hide();
                            engine.mapEditor.show();
                            if (!engine.mapEditor.editMode && engine.mapEditor.toggleEditMode) engine.mapEditor.toggleEditMode();
                            if (engine.mapEditor.setLayer) engine.mapEditor.setLayer(options.layer || 'terrain');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'map-collision' && engine.mapEditor) {
                            if (engine.worldEditor && engine.worldEditor.visible && engine.worldEditor.hide) engine.worldEditor.hide();
                            engine.mapEditor.show();
                            if (!engine.mapEditor.editMode && engine.mapEditor.toggleEditMode) engine.mapEditor.toggleEditMode();
                            if (engine.mapEditor.setLayer) engine.mapEditor.setLayer(options.layer || 'collision');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'map-units' && engine.mapEditor) {
                            if (engine.worldEditor && engine.worldEditor.visible && engine.worldEditor.hide) engine.worldEditor.hide();
                            engine.mapEditor.show();
                            if (!engine.mapEditor.editMode && engine.mapEditor.toggleEditMode) engine.mapEditor.toggleEditMode();
                            if (engine.mapEditor.setLayer) engine.mapEditor.setLayer(options.layer || 'entities');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'world-zone' && engine.worldEditor) {
                            if (engine.mapEditor && engine.mapEditor.visible && engine.mapEditor.hide) engine.mapEditor.hide();
                            engine.worldEditor.show();
                            if (!engine.worldEditor.editMode && engine.worldEditor.toggleEditMode) engine.worldEditor.toggleEditMode();
                            if (engine.worldEditor.setLayer) engine.worldEditor.setLayer(options.layer || 'zone');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'world-trigger' && engine.worldEditor) {
                            if (engine.mapEditor && engine.mapEditor.visible && engine.mapEditor.hide) engine.mapEditor.hide();
                            engine.worldEditor.show();
                            if (!engine.worldEditor.editMode && engine.worldEditor.toggleEditMode) engine.worldEditor.toggleEditMode();
                            if (engine.worldEditor.setLayer) engine.worldEditor.setLayer(options.layer || 'trigger');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'world-spawner' && engine.worldEditor) {
                            if (engine.mapEditor && engine.mapEditor.visible && engine.mapEditor.hide) engine.mapEditor.hide();
                            engine.worldEditor.show();
                            if (!engine.worldEditor.editMode && engine.worldEditor.toggleEditMode) engine.worldEditor.toggleEditMode();
                            if (engine.worldEditor.setLayer) engine.worldEditor.setLayer(options.layer || 'spawner');
                            applyStudioEmbedChrome();
                            return true;
                        }
                        if (requestedTool === 'builder' && engine.storyBuilder && engine.storyBuilder.show) {
                            if (studioMode) {
                                window.open('index.html?tool=builder&builderTab=' + encodeURIComponent(options.builderTab || builderTab || 'maps'), '_blank');
                                return true;
                            }
                            engine.storyBuilder.show();
                            if ((options.builderTab || builderTab) && RealmKit._sidebar && RealmKit._sidebar._switchBuilderTab) {
                                RealmKit._sidebar._switchBuilderTab(options.builderTab || builderTab);
                            }
                            return true;
                        }
                    } catch (toolError) {
                        console.error('[RealmKit] Tool launch error:', toolError);
                    }
                    return false;
                }

                function bindStudioBridge() {
                    if (!studioMode) return;
                    window.engine = engine;
                    window.realmStudioBridge = {
                        launchTool: function(requestedTool, options) {
                            return launchTool(requestedTool, options || {});
                        },
                        getState: function() {
                            return {
                                tool: currentTool,
                                mapEditorVisible: !!(engine.mapEditor && engine.mapEditor.visible),
                                worldEditorVisible: !!(engine.worldEditor && engine.worldEditor.visible)
                            };
                        }
                    };
                    window.addEventListener('message', function(event) {
                        var data = event.data;
                        if (!data || data.type !== 'realm-studio-command' || data.command !== 'launch-tool') return;
                        launchTool(data.tool, data);
                    });
                    applyStudioEmbedChrome();
                }

                function openRequestedTool() {
                    if (!tool) return;
                    window.setTimeout(function() {
                        launchTool(tool, { builderTab: builderTab });
                    }, 700);
                }
                
                // Launcher mode: ?mode=launcher or ?mode=story or ?mode=select
                // Demo mode (default): no mode param or ?mode=demo or ?mode=VisualDev
                // VisualDev: auto-refresh OFF for manual dev work
                var showLauncher = mode === 'launcher' || mode === 'story' || mode === 'select';
                
                if (showLauncher && typeof RealmKit.StoryLauncher === 'function') {
                    console.log('[RealmKit] Showing StoryLauncher (mode=' + mode + ')');
                    var launcher = new RealmKit.StoryLauncher({
                        container: document.body,
                        engine: engine
                    });
                    
                    launcher.on('select', function(storyId) {
                        console.log('[StoryLauncher] Selected story:', storyId);
                        engine.loadStory(storyId).then(function() {
                            engine.start();
                            bindStudioBridge();
                            openRequestedTool();
                        }).catch(function(e) {
                            console.warn('[StoryLauncher] Failed to load story, using default:', e);
                            engine.loadDefaultStory();
                            engine.start();
                            bindStudioBridge();
                            openRequestedTool();
                        });
                    });
                    
                    launcher.on('offline', function() {
                        console.log('[StoryLauncher] Offline mode - loading default story');
                        engine.loadDefaultStory();
                        engine.start();
                        bindStudioBridge();
                        openRequestedTool();
                    });
                    
                    launcher.show();
                } else {
                    console.log('[RealmKit] Demo mode - loading default story directly');
                    engine.loadDefaultStory();
                    engine.start();
                    bindStudioBridge();
                    openRequestedTool();
                }

                // Instantiate the Map Gen Panel (F3)
                if (typeof RealmKit.MapGenPanel === 'function') {
                    var mapGenPanel = new RealmKit.MapGenPanel(engine);
                    console.log('[RealmKit] MapGenPanel ready — press F3 to open');
                }

                // Expose for debugging only when debug mode is on
                if (studioMode || (RealmKit.Config && RealmKit.Config.debug && RealmKit.Config.debug.enabled)) {
                    window.engine = engine;
                    window.AssetCache = RealmKit.AssetCache;
                    console.log('[RealmKit] Debug: engine and AssetCache exposed to window');
                }
            } catch (error) {
                console.error('[RealmKit] Initialization error:', error);
                console.error('[RealmKit] Stack:', error.stack);
                
                var infoElement = document.getElementById('info-bar');
                if (infoElement) {
                    infoElement.innerHTML = 'ERROR: ' + error.message;
                    infoElement.style.color = '#ff4444';
                }
            }
        });
    </script>
